<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#161e1b"><title>DOG / 局域网遥控</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<header><div class="brand"><span class="mark">D<span>•</span>G</span><span class="edition">ROBOT CONTROL / 01</span></div><div id="connection" class="badge"><i></i><span>连接中</span></div></header>
<section class="intro"><div><p class="eyebrow">LOCAL CONTROL</p><h1>方向，掌握在手中。</h1><p class="subtitle">同一 Wi-Fi · 实时摇杆 · IMU 航向辅助</p></div><span id="mode" class="mode">等待控制器</span></section>
<section class="metrics"><div><span>目标前后速度</span><strong id="velocity">0.000 <small>m/s</small></strong></div><div><span>目标转向速度</span><strong id="turn">0.0 <small>°/s</small></strong></div><div><span>机身航向</span><strong id="heading">— <small>°</small></strong></div></section>
<div class="workspace"><section class="pad-card"><div class="section-title"><h2>行走摇杆</h2><span id="imu" class="chip">IMU 等待中</span></div><div class="joystick-wrap"><span class="north">前进</span><span class="west">左转</span><span class="east">右转</span><span class="south">后退</span><div id="joystick" role="slider" tabindex="0" aria-label="行走摇杆，上下前后，左右转向" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><div class="cross horizontal"></div><div class="cross vertical"></div><div class="ring"></div><div id="stick"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m20 8-4 5h8zM20 32l-4-5h8zM8 20l5-4v8zM32 20l-5-4v8z"/></svg></div></div><div id="pad-overlay">先使能，再站立</div></div><p class="pad-hint">按住拖动 · 松手收步 · 直推时保持航向</p><div class="scale"><label for="speed">摇杆幅度 <strong id="speed-label">100%</strong></label><input type="range" id="speed" min="20" max="100" value="100" step="10"></div></section>
<section class="controls"><div class="section-title"><h2>电机与姿态</h2><span id="motor-state" class="chip">未使能</span></div><button id="enable" class="button primary" data-action="enable"><span class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v9M6 5a9 9 0 1 0 12 0"/></svg></span><span>使能电机<small>保持当前关节位置</small></span><span>↗</span></button><div class="pose-buttons"><button id="zero" class="button secondary" data-action="zero">回零位</button><button id="stand" class="button secondary" data-action="stand">站立</button></div><button id="stop" class="button stop" data-action="teleop_stop">停止行走 <small>收步后保持站立</small></button><button id="disable" class="button danger" data-action="disable"><span class="icon">■</span><span>失能电机<small>撤去电机支撑</small></span><span>↘</span></button><div class="feedback"><div class="section-title"><h2>实时反馈</h2><span class="live-dot"></span></div><p id="message" aria-live="polite">正在连接 NUC…</p><div class="feedback-bottom"><span>航向偏差 <b id="error">—</b></span><span id="control-state">等待指令</span></div></div></section></div>
<div class="quick-controls"><button id="quick-stop" data-action="teleop_stop">停止行走</button><button id="quick-disable" data-action="disable">■ 失能电机</button></div><footer><span>DOG / NUC</span><span>松手、断线或切到后台后自动收步 · 失能会松腿</span><span id="host"></span></footer><div id="toast" role="status"></div>
</main><script src="/app.js"></script></body></html>
