# Navigation tuning, NOT motor hardware ratings. v/w inherit the deployed IK bank.
/dog_nav/dog_planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.05
      use_astar: false
      allow_unknown: false

/dog_nav/dog_controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: /dog_nav/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # Stock controller emits zero velocity while awaiting the next 1 s replan.
    failure_tolerance: 3.0
    progress_checker_plugin: dog_progress_checker
    goal_checker_plugins: [dog_goal_checker]
    controller_plugins: [FollowPath]
    dog_progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 45.0
    dog_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      # User-requested approximate waypoint arrival, not hardware limits.
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 3.141592653589793
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.08
      lookahead_dist: 0.50
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.50
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.15
      # Six-action executor translates while steering; no rotate-first stage.
      rotate_to_heading_min_angle: 1.5707963267948966
      max_angular_accel: 0.30
      use_rotate_to_heading: false
      allow_reversing: true
      transform_tolerance: 0.20
      min_approach_linear_velocity: 0.025
      approach_velocity_scaling_dist: 0.40
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.50
      regulated_linear_scaling_min_speed: 0.025
      use_cost_regulated_linear_velocity_scaling: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

/dog_nav/dog_global_costmap/dog_global_costmap:
  ros__parameters:
    global_frame: dog_lio_map
    robot_base_frame: dog_base_link
    update_frequency: 2.0
    publish_frequency: 1.0
    resolution: 0.05
    rolling_window: false
    track_unknown_space: true
    robot_radius: 0.0  # Explicit point-robot offline proof; hardware launch requires measured footprint.
    footprint_padding: 0.0
    always_send_full_costmap: true
    plugins: [static_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /dog_nav/map
      map_subscribe_transient_local: true

/dog_nav/dog_local_costmap/dog_local_costmap:
  ros__parameters:
    global_frame: dog_odom
    robot_base_frame: dog_base_link
    update_frequency: 5.0
    publish_frequency: 2.0
    resolution: 0.05
    rolling_window: true
    width: 5
    height: 5
    track_unknown_space: true
    robot_radius: 0.0
    footprint_padding: 0.0
    always_send_full_costmap: true
    plugins: [static_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /dog_nav/map
      map_subscribe_transient_local: true

/dog_nav/dog_bt_navigator:
  ros__parameters:
    global_frame: dog_lio_map
    robot_base_frame: dog_base_link
    odom_topic: /dog_nav/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_rate_controller_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_recovery_node_bt_node
      - nav2_wait_action_bt_node

/dog_nav/dog_behavior_server:
  ros__parameters:
    costmap_topic: dog_local_costmap/costmap_raw
    footprint_topic: dog_local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: dog_odom
    robot_base_frame: dog_base_link
    transform_tolerance: 0.2
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait

/dog_nav/dog_amcl:
  ros__parameters:
    global_frame_id: dog_lio_map
    odom_frame_id: dog_odom
    base_frame_id: dog_base_link
    scan_topic: /dog_nav/scan
    set_initial_pose: false
    tf_broadcast: true
    transform_tolerance: 0.2
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    min_particles: 500
    max_particles: 2000
    max_beams: 60
    update_min_a: 0.05
    update_min_d: 0.05
    resample_interval: 1
    first_map_only: false
